[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
werewolf-engine = { path = "crates/engine" }
werewolf-protocol = { path = "crates/protocol" }
werewolf-verify = { path = "crates/verify", default-features = false }
