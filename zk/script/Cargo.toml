[package]
name = "werewolf-prove"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
alloy-sol-types = "1.7.3"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
serde_json = "1"
sp1-sdk = { version = "=6.1.0", features = ["network"] }
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }
werewolf-verify = { path = "../../crates/verify", default-features = false }

[build-dependencies]
sp1-build = "=6.1.0"
