[package]
name = "werewolf-chain"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
alloy = { version = "2.4.2", default-features = false, features = ["essentials", "reqwest", "reqwest-rustls-tls", "std"] }
rand = "0.10.3"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["fs", "macros", "sync", "time"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
zeroize = "1.9.0"

[dev-dependencies]
alloy = { version = "2.4.2", features = ["node-bindings"] }
serde_json.workspace = true
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["io-util", "net", "rt-multi-thread"] }
