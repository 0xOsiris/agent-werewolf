[package]
name = "werewolf-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
gethostname = "1.1.0"
hex = "0.4.3"
if-addrs = "0.15.0"
mdns-sd = "0.21.5"
parking_lot = "0.12.5"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rand = "0.10.3"
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
serde.workspace = true
serde_json.workspace = true
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "net", "fs", "io-util"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
werewolf-protocol.workspace = true

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tempfile = "3.27.0"
